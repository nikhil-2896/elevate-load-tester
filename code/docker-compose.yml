services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elevate
      POSTGRES_PASSWORD: elevate
      POSTGRES_DB: elevate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevate"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elevate:elevate@db:5432/elevate
    deploy:
      replicas: 2        # two API instances sharing one database

  proxy:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro